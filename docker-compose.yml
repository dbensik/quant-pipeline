version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: quant_timescaledb
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_pipeline
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: quant_backend
    # Port 8001, not 8000 — the GraphQL gateway owns 8000 (services/config.py
    # GRAPHQL_PORT). Keep these distinct or `run_pipeline.sh all` collides.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://quant:quant@timescaledb:5432/quant_pipeline
    depends_on:
      timescaledb:
        condition: service_healthy

  dashboard:
    build: .
    container_name: quant_dashboard
    command: streamlit run dashboard_app/dashboard.py
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://quant:quant@timescaledb:5432/quant_pipeline
    depends_on:
      timescaledb:
        condition: service_healthy

  pipeline:
    build: .
    container_name: quant_pipeline_worker
    command: python -m cli.run_pipeline
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://quant:quant@timescaledb:5432/quant_pipeline
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
