version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: quant_timescaledb
    # Comes back on its own after a reboot or a Docker Desktop restart.
    # Without this the 06:00 cron aborts with "database unreachable" every
    # morning following a restart — Docker Desktop starting at login is
    # necessary but not sufficient, because it does not start containers.
    # `always`, not `unless-stopped`. Measured on macOS 26.6: Docker Desktop's
    # shutdown stops containers in a way the daemon records as an explicit
    # stop, so `unless-stopped` left the container Exited across a restart —
    # verified twice, via `osascript quit` and `docker desktop restart`. That
    # is precisely the reboot case this needs to survive.
    # Trade-off accepted: `docker compose stop` will also be undone by a
    # Docker restart. Use `docker compose down` for real maintenance.
    restart: always
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_pipeline
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: quant_backend
    # Port 8001, not 8000 — the GraphQL gateway owns 8000 (services/config.py
    # GRAPHQL_PORT). Keep these distinct or `run_pipeline.sh all` collides.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://quant:quant@timescaledb:5432/quant_pipeline
    depends_on:
      timescaledb:
        condition: service_healthy

  # The Streamlit dashboard service was removed on 2026-08-09 along with
  # dashboard_app/. The UI is now the React app in frontend/, which is a
  # static build plus a dev server — it needs a Node image rather than this
  # Python one, and it talks to the `api` service over HTTP rather than
  # sharing the database. Run it with `./run_pipeline.sh dashboard`, or add a
  # node service here when containerising it becomes worthwhile.

  pipeline:
    build: .
    container_name: quant_pipeline_worker
    command: python -m cli.run_pipeline
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://quant:quant@timescaledb:5432/quant_pipeline
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
