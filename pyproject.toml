# This section tells packaging tools like pip how to build your project.
# It's correct as is and doesn't need changes.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# The [project] table contains all the metadata about your package.
# This is the modern standard defined in PEP 621.
[project]
name = "quant-pipeline"
version = "0.1.0"
description = "A data pipeline and analysis dashboard for quantitative finance strategies."
readme = "README.md"
# Upper bound is required: without it, Poetry refuses any dependency that caps
# its own Python support (strawberry-graphql <4.0, pykalman <3.15), forcing a
# per-package environment marker on each one.
requires-python = ">=3.11,<4.0"
license = { text = "MIT" } # Or choose another license like "Apache-2.0"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Streamlit",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core runtime dependencies needed for your application to run.
# These are the packages that will be installed when someone does 'pip install your-package'.
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "requests",
    "beautifulsoup4",
    "curl-cffi",
    "yfinance",
    "peewee",
    "fastapi",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "sqlalchemy[asyncio] (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pycoingecko (>=3.2.0,<4.0.0)",
    "aiosqlite (>=0.21.0,<1.0.0)",
    "pandas-stubs (>=2.3.3,<2.4.0)",
    "psycopg2-binary (>=2.9,<3.0)",
    "greenlet (>=3.5.4,<4.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "pykalman (>=0.11.2,<0.12.0) ; python_version >= \"3.11\" and python_version < \"3.15\"",
    "grpcio (>=1.83.0,<2.0.0)",
    "grpcio-tools (>=1.83.0,<2.0.0)",
    "strawberry-graphql[cli] (>=0.323.2,<0.324.0)"

]

# This section defines "extras", which are optional sets of dependencies.
# It's a best practice to separate development/testing tools from runtime dependencies.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",       # provides the `mocker` fixture used by tests/test_dynamic_universe.py
    "jupyterlab",
    "ipykernel",
]

# This creates a command-line script. After installation, you can run
# 'run-quant-pipeline' from your terminal to execute the main function
# in 'cli/run_pipeline.py'.
[project.scripts]
run-quant-pipeline = "cli.run_pipeline:main"

# This section is for configuring tools. Here, we configure pytest.
# This replaces the need for a separate pytest.ini file.
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = "-ra -q -m 'not integration'" # Report all test info except passes, quiet mode, and skip tests needing a live database.
markers = [
    # Tests requiring a running TimescaleDB (docker-compose up -d timescaledb).
    # Deselected by default so `pytest tests/` stays runnable with no Docker.
    # Run them with: pytest -m integration
    "integration: requires a live TimescaleDB",
]

# This tells setuptools to automatically find all the packages in your project
# (like 'dashboard_app', 'data_pipeline', etc.) without you having to list them manually.
[tool.setuptools.packages.find]
where = ["."]

[tool.poetry]
name = "quant-pipeline"
version = "0.1.0"
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
