# alembic.ini — Alembic configuration for the TimescaleDB schema.
#
# Phase 2 — TimescaleDB Schema & Repository Layer
#
# Run from the project root:
#     alembic upgrade head          # apply migrations
#     alembic downgrade base        # roll back
#     alembic revision --autogenerate -m "your message"
#
# NOTE: sqlalchemy.url is deliberately left empty below. db/migrations/env.py
# loads .env and calls config.set_main_option("sqlalchemy.url", SYNC_DATABASE_URL)
# before any migration runs. Alembic needs the *sync* driver (postgresql://),
# not the async one (postgresql+asyncpg://) the application uses.

[alembic]
script_location = db/migrations

# Left empty on purpose — env.py injects SYNC_DATABASE_URL at runtime.
sqlalchemy.url =

# Timestamped revision filenames, newest last when sorted.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Paths in version_locations / script_location are resolved relative to this file.
prepend_sys_path = .

# ---------------------------------------------------------------------------
# Logging — fileConfig() in env.py requires these three sections to exist.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
